<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Code - Step 1</title>
</head>
<body>
<div id="code"></div>
<script>
const STAGE_NUM = 1;
const SECRET = "STAGE_1_SECRET";
const PREFIX = "S1-";

const todayUtc = new Date().toISOString().slice(0, 10);
const input = todayUtc + "|" + SECRET;

let hash = 2166136261;
for (let i = 0; i < input.length; i++) {
  hash ^= (input.charCodeAt(i) & 0xff);
  hash = Math.imul(hash, 16777619) >>> 0;
}

let base36 = hash.toString(36).toUpperCase();
if (base36.length > 5) {
  base36 = base36.slice(0, 5);
}

document.getElementById("code").textContent = PREFIX + base36;
</script>
</body>
</html>
